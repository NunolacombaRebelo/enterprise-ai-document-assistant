[project]
name = "enterprise-ai-document-assistant"
version = "0.1.0"
description = "AI document assistant for small businesses: upload PDFs, extract content, index, and ask grounded natural-language questions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "streamlit>=1.36",
    "pypdf>=4",
    # Runtime HTTP client used by the Streamlit frontend (frontend/api/client.py).
    "httpx>=0.27",
    # Milestone 2 — RAG infrastructure.
    # Persistent embedded vector store (local dir, volume-backed in Docker). No external service.
    "chromadb>=1.0",
    # Pure-Python BM25 lexical retrieval for hybrid search. No native build.
    "rank-bm25>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_ai_document_assistant"]

# ---------------------------------------------------------------------------
# uv — dependency constraints (applied at resolve time, not a direct dependency)
# ---------------------------------------------------------------------------
# chromadb pulls huggingface-hub, whose 2.x line depends on `httpx2`. Starlette's
# TestClient (used by FastAPI/pytest) prefers `httpx2` over `httpx` when both are
# importable, which breaks the frontend's real-`httpx` client in tests (a stream-type
# mismatch). Pinning huggingface-hub to the 0.x line removes httpx2 from the env while
# keeping chromadb fully functional. This is a transitive constraint, not a new dep.
[tool.uv]
constraint-dependencies = [
    "huggingface-hub<1",
]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting (single source of truth; CI runs both)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "frontend"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["enterprise_ai_document_assistant"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests (Agent 1-owned)",
]
